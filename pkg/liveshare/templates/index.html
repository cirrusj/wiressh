<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WireSSH Live Session</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css" />
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1e1e1e;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
            padding: 20px;
        }
        
        .auth-box {
            background-color: #2d2d2d;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .auth-box h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        
        .form-control {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #1e1e1e;
            color: #f0f0f0;
            font-size: 1rem;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.3);
        }
        
        .btn {
            padding: 10px 20px;
            background-color: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        
        .btn:hover {
            background-color: #106ebe;
        }
        
        .btn:disabled {
            background-color: #3c3c3c;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #f44336;
            min-height: 1.5rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 1.2em;
        }
        .status {
            font-size: 0.9em;
            display: flex;
            align-items: center;
        }
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .connected {
            background-color: #4CAF50;
        }
        .disconnected {
            background-color: #F44336;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            overflow: hidden;
        }
        .info {
            margin-bottom: 10px;
            padding: 10px;
            background-color: #2d2d2d;
            border-radius: 4px;
            font-size: 0.9em;
        }
        #terminal-container {
            flex: 1;
            background-color: #000;
            border-radius: 4px;
            padding: 5px;
            overflow: hidden;
        }
        footer {
            background-color: #333;
            color: #999;
            padding: 10px 20px;
            font-size: 0.8em;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>
<body>
    <header>
        <h1>WireSSH Live Session</h1>
        <div class="status">
            <div id="status-indicator" class="status-indicator disconnected"></div>
            <span id="status-text">Disconnected</span>
        </div>
    </header>
    
    <div class="container">
        <div id="auth-container" class="auth-container">
            <div class="auth-box">
                <h2>Enter Session Password</h2>
                <div class="form-group">
                    <input type="password" id="password-input" class="form-control" placeholder="Enter password" autofocus>
                    <button id="connect-button" class="btn">Connect</button>
                </div>
                <div id="auth-error" class="error-message"></div>
            </div>
        </div>
        <div id="terminal-container" style="display: none;"></div>
    </div>
    
    <footer>
        Powered by WireSSH Live Sharing
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js" integrity="sha384-J4qzUjBl1FxyLsl/kQPQIOeINsmp17OHYXDOMpMxlKX53ZfYsL+aWHpgArvOuof9" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js" integrity="sha384-XGqKrV8Jrukp1NITJbOEHwg01tNkuXr6uB6YEj69ebpYU3v7FvoGgEg23C1Gcehk" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js" integrity="sha384-S1biLeI8L/bFduIVvCxbn/l4EtaG4nTqQjGF7qCYTbsGXGFe8KgIKXtw4+UWxprv" crossorigin="anonymous"></script>
    <script>
        // Initialize terminal
        const terminal = new Terminal({
            cursorBlink: false,
            fontFamily: 'Menlo, Monaco, "Courier New", monospace',
            fontSize: 14,
            theme: {
                background: '#000000',
                foreground: '#f0f0f0',
                cursor: '#f0f0f0',
                selectionBackground: '#4040ff',
                black: '#000000',
                red: '#cc0000',
                green: '#4e9a06',
                yellow: '#c4a000',
                blue: '#3465a4',
                magenta: '#75507b',
                cyan: '#06989a',
                white: '#d3d7cf',
                brightBlack: '#555753',
                brightRed: '#ef2929',
                brightGreen: '#8ae234',
                brightYellow: '#fce94f',
                brightBlue: '#729fcf',
                brightMagenta: '#ad7fa8',
                brightCyan: '#34e2e2',
                brightWhite: '#eeeeec'
            }
        });
        
        // Get DOM elements
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');
        const authContainer = document.getElementById('auth-container');
        const terminalContainer = document.getElementById('terminal-container');
        const passwordInput = document.getElementById('password-input');
        const connectButton = document.getElementById('connect-button');
        const authError = document.getElementById('auth-error');
        
        // Initialize terminal (but don't show it yet)
        terminal.open(terminalContainer);
        
        // Add fit addon to make terminal resize with container
        const fitAddon = new FitAddon.FitAddon();
        terminal.loadAddon(fitAddon);
        
        // Add web links addon to make URLs clickable
        terminal.loadAddon(new WebLinksAddon.WebLinksAddon());
        
        // Fit terminal to container
        function fitTerminal() {
            try {
                fitAddon.fit();
            } catch (err) {
                console.error('Error fitting terminal:', err);
            }
        }
        
        // Resize terminal when window size changes
        window.addEventListener('resize', fitTerminal);
        
        // Initial fit
        setTimeout(fitTerminal, 100);
        
        let reconnectAttempts = 0;
        let currentPassword = '';
        let ws = null;
        
        function connectWebSocket(password) {
            // Close existing connection if any
            if (ws) {
                ws.close();
            }
            
            // Determine WebSocket URL based on current page URL
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?password=${encodeURIComponent(password)}`;
            
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                // Hide auth container and show terminal
                authContainer.style.display = 'none';
                terminalContainer.style.display = 'block';
                
                statusIndicator.classList.remove('disconnected');
                statusIndicator.classList.add('connected');
                statusText.textContent = 'Connected';
                terminal.writeln('\x1b[32mConnected to session.\x1b[0m');
                fitTerminal();
                
                // Focus the terminal
                terminal.focus();
            };
            
            ws.onmessage = function(event) {
                terminal.write(event.data);
            };
            
            ws.onclose = function(event) {
                console.log('WebSocket closed with code:', event.code, 'reason:', event.reason);
                
                // Reset connection state
                statusIndicator.classList.remove('connected');
                statusIndicator.classList.add('disconnected');
                statusText.textContent = 'Disconnected';
                
                // Check for normal closure (1000)
                if (event.code === 1000) {
                    // Show a message that the session has ended
                    authContainer.style.display = 'flex';
                    terminalContainer.style.display = 'none';
                    authError.textContent = 'The session has ended.';
                    connectButton.disabled = true;
                    passwordInput.disabled = true;
                    return;
                }
                
                // Check if this was an authentication failure (1006 is Abnormal Closure, 1008 is Policy Violation)
                if (event.code === 1006 || event.code === 1008) {
                    // Show auth container and hide terminal
                    authContainer.style.display = 'flex';
                    terminalContainer.style.display = 'none';
                    
                    // Show error message and re-enable form
                    authError.textContent = 'Invalid password. Please try again.';
                    connectButton.disabled = false;
                    passwordInput.disabled = false;
                    passwordInput.select();
                    passwordInput.focus();
                    return;
                }
                
                // Only show reconnection UI if we were previously connected
                if (terminalContainer.style.display !== 'none') {
                    terminal.writeln('\x1b[31mDisconnected from session. Attempting to reconnect...\x1b[0m');
                    
                    reconnectAttempts++;
                    if (reconnectAttempts < 5) {
                        // Try to reconnect after a delay
                        setTimeout(() => connectWebSocket(currentPassword), 3000);
                    } else {
                        terminal.writeln('\x1b[31mMaximum reconnect attempts exceeded. Please refresh the page.\x1b[0m');
                    }
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                terminal.writeln('\x1b[31mConnection error. Retrying...\x1b[0m');
            };
        }
        
        // Handle connect button click
        function handleConnect() {
            const password = passwordInput.value.trim();
            if (!password) {
                authError.textContent = 'Please enter a password';
                passwordInput.focus();
                return;
            }
            
            // Reset any previous error
            authError.textContent = '';
            
            // Disable inputs while connecting
            connectButton.disabled = true;
            passwordInput.disabled = true;
            authError.textContent = 'Connecting...';
            
            // Store the current password for reconnection attempts
            currentPassword = password;
            
            // Connect to WebSocket with a timeout
            connectWebSocket(password);
            
            // Set a timeout in case the server doesn't respond
            const timeout = setTimeout(() => {
                if (ws && ws.readyState === WebSocket.CONNECTING) {
                    ws.close();
                    handleConnectionError('Connection timed out. Please try again.');
                }
            }, 10000); // 10 second timeout
            
            // Store the timeout ID to clear it if connection succeeds
            ws.onopen = function() {
                clearTimeout(timeout);
                // Hide auth container and show terminal
                authContainer.style.display = 'none';
                terminalContainer.style.display = 'block';
                
                statusIndicator.classList.remove('disconnected');
                statusIndicator.classList.add('connected');
                statusText.textContent = 'Connected';
                terminal.writeln('\x1b[32mConnected to session.\x1b[0m');
                fitTerminal();
                
                // Focus the terminal
                terminal.focus();
            };
        }
        
        // Handle connection errors
        function handleConnectionError(message) {
            // Show auth container and hide terminal
            authContainer.style.display = 'flex';
            terminalContainer.style.display = 'none';
            
            // Show error message and re-enable form
            authError.textContent = message || 'Connection failed. Please try again.';
            connectButton.disabled = false;
            passwordInput.disabled = false;
            passwordInput.select();
            passwordInput.focus();
        }
        
        // Set up event listeners
        connectButton.addEventListener('click', handleConnect);
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleConnect();
            }
        });
        
        // Focus the password input when the page loads
        window.addEventListener('load', function() {
            passwordInput.focus();
        });
    </script>
</body>
</html>
